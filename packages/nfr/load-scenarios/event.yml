config:
  payload:
    name: "users"
    path: "../users.csv"
    delimiter: ";"
    fields: ["email", "password", "domain"]

scenarios:
  - name: "/event"

    flow:
      - post:
          url: "/event"
          json:
            email: "{{ email }}"
            password: "{{ password }}"
          expect:
            - statusCode: 204

      - think: 0.1