<!doctype html>
<html lang="en">
  <head>
    <title>pulsio — Website analytics</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light">
    <meta name="theme-color" content="#f7f8f2">
    <link rel="preload" as="style" onload="this.onload=null;this.rel='stylesheet'" href="/main.css">
    <script type="module">
      const response = await fetch('/config.json', { cache: 'no-store' });
      if (!response.ok) throw new Error('Could not load application runtime configuration');
      window.config = await response.json();
    </script>
  </head>
  <body>
    <div id="root" class="min-h-screen"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
