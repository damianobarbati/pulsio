apiVersion: apps/v1
kind: Deployment
metadata:
  name: pulsio-superadmin
  namespace: pulsio
  annotations:
    keel.sh/policy: force
    keel.sh/trigger: poll
    keel.sh/pollSchedule: "@every 1m"
    keel.sh/imagePullSecret: "keel-dockerconfig"
    keel.sh/image-tag: "latest"
    keel.sh/match-tag: "true"
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: superadmin
  template:
    metadata:
      labels:
        app: superadmin
    spec:
      imagePullSecrets:
        - name: keel-dockerconfig
      containers:
        - name: superadmin
          image: neuralestate/pulsio-superadmin-production
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          envFrom:
            - secretRef:
                name: envs
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "250m"
      volumes:
        - name: runtime-env
          configMap:
            name: superadmin-env

---

apiVersion: v1
kind: Service
metadata:
  name: superadmin-service
  namespace: pulsio
spec:
  selector:
    app: superadmin
  ports:
    - port: 80
      targetPort: 80

---

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: superadmin-ingress
  namespace: pulsio
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  tls:
    - hosts:
        - superadmin.pulsio.live
      secretName: pulsio-superadmin-tls
  rules:
    - host: superadmin.pulsio.live
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: superadmin-service
                port:
                  number: 80
