services:
  db:
    container_name: pulsio-db
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_DB=pulsio
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
    command: "-c log_statement=all -c log_min_duration_statement=0"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d pulsio"]
      start_period: 5s
      interval: 10s
      retries: 3
      timeout: 1s
    ports:
      - "5432:5432"
    volumes:
      - db:/var/lib/postgresql

  ch:
    image: clickhouse/clickhouse-server:26.3-alpine
    container_name: pulsio-clickhouse
    restart: unless-stopped
    environment:
      - CLICKHOUSE_DB=pulsio
      - CLICKHOUSE_USER=user
      - CLICKHOUSE_PASSWORD=password
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user=user --password=password --database=pulsio --query 'SELECT 1'"]
      start_period: 10s
      interval: 10s
      retries: 5
      timeout: 3s
    ports:
      - 8123:8123
      - 9000:9000
    volumes:
      - ch:/var/lib/clickhouse

  cache:
    image: redis:8-alpine
    container_name: pulsio-cache
    restart: unless-stopped
    environment:
      - REDIS_PASSWORD=password
    command: redis-server --appendonly yes --appendfsync everysec --save 20 1 --loglevel warning --requirepass password
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "password", "ping"]
      start_period: 3s
      interval: 3s
      retries: 3
      timeout: 1s
    ports:
      - '6379:6379'
    volumes:
      - cache:/data

  mailpit:
    image: axllent/mailpit:latest
    container_name: mailpit
    restart: unless-stopped
    environment:
      - MP_SMTP_AUTH_ACCEPT_ANY=true
      - MP_SMTP_AUTH_ALLOW_INSECURE=true
    ports:
      - 8025:8025
      - 1025:1025

  stripe:
    image: stripe/stripe-cli:latest
    container_name: stripe
    command: listen --api-key ${STRIPE_SECRET_KEY?} --forward-to host.docker.internal:8080/webhook --log-level debug
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  db:
    driver: local
  ch:
    driver: local
  cache:
    driver: local
